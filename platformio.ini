; ============================================================
; T-Display ESP32 + STL-27L LiDAR Radar
; --------------------------------------
; PlatformIO project that visualises an STL-27L 2D LiDAR sensor
; as a live radar on a TTGO T-Display (ESP32, ST7789 135x240).
;
; Pin hook-up (STL-27L -> T-Display ESP32)
; ----------------------------------------
;   Pin 1 (Tx)  -> GPIO 27  (LIDAR_DATA_PIN in src/main.ino, required)
;   Pin 2 (PWM) -> GPIO 26  (LIDAR_PWM_PIN in src/main.ino, optional;
;                            pass -1 to Lidar.begin() if not wired)
;   Pin 3 (GND) -> GND      (common ground mandatory)
;   Pin 4 (P5V) -> 5V       (sensor power)
;
; License
; -------
; This is free and unencumbered software released into the public domain.
; Anyone is free to copy, modify, publish, use, compile, sell, or
; distribute this software, either in source code form or as a compiled
; binary, for any purpose, commercial or non-commercial, and by any means.
;
; For more information, see <https://unlicense.org>
; ============================================================

[env:ttgo-t-display]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 921600
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI

build_flags =
    ; Number of angular bins maintained by the STL-27L library.
    -D STL27L_POINT_COUNT=720

    ; Prevent TFT_eSPI from loading its default setup.
    -D USER_SETUP_LOADED=1

    ; TFT driver.
    -D ST7789_DRIVER=1

    ; Native display dimensions.
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240

    ; Classic TTGO T-Display pin assignment.
    -D TFT_MISO=-1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH

    ; Display options.
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D CGRAM_OFFSET=1

    ; Fonts.
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    ; TFT SPI clock.
    -D SPI_FREQUENCY=40000000